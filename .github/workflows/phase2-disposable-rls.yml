name: Phase 2 disposable database verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/supabase/**'
      - '.github/workflows/phase2-disposable-rls.yml'
permissions:
  contents: read
jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Run disposable local Supabase stack
        run: npx supabase start --workdir database
      - name: Run pgTAP suites against disposable local DB
        run: npm run test:rls
